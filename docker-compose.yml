version: "3.8"
services:
  app:
    build: .
    ports: ["8501:8501"]
    volumes: ["./models:/app/models", "./data:/app/data"]
    environment: ["MODEL_PATH=models/resnet50_medical.pth"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
